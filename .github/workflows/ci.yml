name: Resume service CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careeros_resume
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: careeros_resume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros_resume -d careeros_resume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESUME_DATABASE_URL: postgresql+psycopg://careeros_resume:test-only@localhost:5432/careeros_resume_test
      TEST_RESUME_DATABASE_URL: postgresql+psycopg://careeros_resume:test-only@localhost:5432/careeros_resume_test
      TEST_RESUME_S3_ENDPOINT: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: Start isolated SeaweedFS
        run: |
          docker run --detach --name careeros-resume-s3 --publish 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID=fixture-access -e AWS_SECRET_ACCESS_KEY=fixture-secret \
            -e S3_BUCKET=careeros-resumes-test chrislusf/seaweedfs:4.53 mini -dir=/data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8333/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs careeros-resume-s3
          exit 1
      - run: uv run pytest
      - run: uv run pip-audit
      - run: uv run bandit -q -r src
      - run: uv run python -m careeros_resume.adapters.postgresql.migrations.runner upgrade
      - run: uv run python -m careeros_resume.adapters.postgresql.migrations.runner downgrade
      - uses: actions/checkout@v4
        with:
          repository: FievezRomain/careeros-workspace
          ref: 7f891a311e6448baaf83bd677899676fd5a8a4f5
          path: .careeros-workspace
      - run: uv run python .careeros-workspace/scripts/check_service_quality.py .
