[project]
name = "careeros-resume-service"
version = "0.1.0"
description = "CareerOS immutable resume version registry"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.165,<0.166", "httpx2>=2.16,<3", "psycopg[binary]>=3.3,<4", "pydantic>=2.12,<3", "pydantic-settings>=2.16,<3", "pyjwt[crypto]>=2.10,<3", "sqlalchemy>=2.0,<3", "uvicorn>=0.54,<0.55"]

[dependency-groups]
dev = ["bandit>=1.9,<2", "mypy>=1.19,<2", "pip-audit>=2.10,<3", "pytest>=9.2,<10", "ruff>=0.14,<0.15"]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_resume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.careeros.quality]
package = "src/careeros_resume"
persistence = true
domain = "src/careeros_resume/domain"
application = "src/careeros_resume/application"
ports = "src/careeros_resume/application"
adapters = "src/careeros_resume/adapters"
composition_root = "src/careeros_resume/bootstrap.py"
migrations = "src/careeros_resume/adapters/postgresql/migrations"
migration_runner = "src/careeros_resume/adapters/postgresql/migrations/runner.py"

[tool.careeros.quality.commands]
format = "uv run ruff format --check ."
lint = "uv run ruff check ."
type = "uv run mypy src tests"
test = "uv run pytest"
secret = "gitleaks detect --redact --no-banner"
security = "uv run pip-audit && uv run bandit -q -r src"
migrate_up = "uv run python -m careeros_resume.adapters.postgresql.migrations.runner upgrade"
migrate_down = "uv run python -m careeros_resume.adapters.postgresql.migrations.runner downgrade"

[tool.careeros.quality.logging]
structured = true
correlation = true
redaction = true

[tool.careeros.quality.evidence]
unit = "tests/test_domain.py"
integration = "tests/test_http.py"
contract = "tests/test_http.py"
health = "tests/test_http.py"
logging = "tests/test_http.py"
security = "tests/test_http.py"
migrations = "tests/test_store.py"
startup_migrations = "tests/test_http.py"
